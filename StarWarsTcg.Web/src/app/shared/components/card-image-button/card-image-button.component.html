<div class="button-container" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
    <i class="text-warning fa fa-camera" alt="View" title="" (click)="onButtonClick()"></i>
    <span *ngIf="isHovered" class="image-popup" [ngClass]="alignment">
        <img [src]="imageUrl" [alt]="imageUrl" />
    </span>
</div>
