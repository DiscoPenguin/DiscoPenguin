<div class="container mt-4">
  <h2>Card Search</h2>
  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" method="'POST'">
    <div class="form-group">
      <label for="searchTerm">Search Term</label>
      <input type="text" id="searchTerm" class="form-control" formControlName="searchTerm">
    </div>
    <div class="form-group">
      <label for="useLikeness">Likeness</label>
      <select id="useLikeness" class="form-control" formControlName="useLikeness">
          <option value="true" selected>Contains</option>
          <option value="false">Equals</option>
      </select>
    </div>
    <div class="form-group">
      <label for="sortField">Sort Field</label>
      <select id="sortField" class="form-control" formControlName="sortField">
        <option value="Name" selected>Name</option>
        <option value="Id">Number</option>
        <option value="Rarity">Rarity</option>
        <option value="Power">Power</option>
        <option value="Health">Health</option>
        <option value="Speed">Speed</option>
        <option value="Cost">Cost</option>
      </select>
    </div>
    <div class="form-group">
      <label for="sortDirection">Sort Direction</label>
      <select id="sortDirection" class="form-control" formControlName="sortDirection">
        <option value="asc" selected>Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
    <div class="form-group">
      <label for="pageSize">Page Size</label>
      <input type="number" id="pageSize" class="form-control" formControlName="pageSize" min="1" max="100">
    </div>
    <div class="col-lg-12">
      <div class="main-button">
        <button type="submit" class="styled-button">Search</button>
      </div>
    </div>
  </form>
  <br />
  <div class="mt-4">
    <h3>Results (Total: {{ totalResults }})</h3>

    <table class="table table-bordered table-striped table-hover">
      <thead>
        <tr>
          <th scope="col">Action</th>
          <th scope="col">Name</th>
          <th scope="col">Type</th>
          <th scope="col">Subtype</th>
          <th scope="col">Text</th>
          <th scope="col">Rarity</th>
          <th scope="col">Cost</th>
          <th scope="col">Speed</th>
          <th scope="col">Power</th>
          <th scope="col">Health</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let card of results">
          <td>
            <span class="me-1"><i class="fa fa-square-plus" (click)="addCardtoDeck(card)"></i></span>
            <span><i class="fa fa-square-minus" (click)="removeCardfromDeck(card)"></i></span>
            <hr />
            <!-- TODO: redirectUrl does not exist (yet) -->
            <app-card-image-button
              [imageUrl]='imagePath(card)'
              [alignment]="card.type == 'Character' || card.type == 'Space' || card.type == 'Ground' ? 'vertical' : 'horizontal'"
              [redirectUrl]="'/cards/' + card?.id"
            />
            <img 
                [src]="forceIcon(card?.side)"
                class="icon" 
            />            
            <img 
                src="/assets/images/expansions/{{ card?.expansionSet }}.png" 
                class="icon" 
                title="{{ card?.expansionSet }}"
            />
          </td>
          <td>{{ card.name }}</td>
          <td [ngClass]="'bg-' + card.type">{{ card.type }}</td>
          <td>{{ card.subtype }}</td>
          <td>{{ card.text }}</td>
          <td>{{ card.rarity }}</td>
          <td>{{ card.cost }}</td>
          <td>{{ card.speed }}</td>
          <td>{{ card.power }}</td>
          <td>{{ card.health }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
